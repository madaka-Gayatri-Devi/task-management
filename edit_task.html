{% extends 'base.html' %}
{% block content %}
<h2>Edit Task</h2>
<form method="post">
    <input type="text" name="title" value="{{ task[1] }}">
    <textarea name="description">{{ task[2] }}</textarea>
    <input type="text" name="tools" value="{{ task[3] }}">
    <select name="status">
        <option value="Pending" {% if task[4]=='Pending' %}selected{% endif %}>Pending</option>
        <option value="Ongoing" {% if task[4]=='Ongoing' %}selected{% endif %}>Ongoing</option>
        <option value="Completed" {% if task[4]=='Completed' %}selected{% endif %}>Completed</option>
    </select>
    <button>Update</button>
</form>
{% endblock %}
